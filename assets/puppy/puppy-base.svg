<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <!-- Body -->
    <path d="M 30,50 Q 30,90 50,90 Q 70,90 70,50 Z" fill="#d3a77d"/>
    <!-- Head -->
    <circle cx="50" cy="40" r="25" fill="#d3a77d"/>
    <!-- Ears -->
    <ellipse cx="25" cy="40" rx="10" ry="20" fill="#a07855" transform="rotate(-15 25 40)"/>
    <ellipse cx="75" cy="40" rx="10" ry="20" fill="#a07855" transform="rotate(15 75 40)"/>
    <!-- Eyes -->
    <circle cx="40" cy="35" r="4" fill="#000"/>
    <circle cx="60" cy="35" r="4" fill="#000"/>
    <!-- Blush -->
    <circle cx="33" cy="42" r="3" fill="#ffb6c1" opacity="0.8"/>
    <circle cx="67" cy="42" r="3" fill="#ffb6c1" opacity="0.8"/>
    <!-- Nose -->
    <ellipse cx="50" cy="42" rx="5" ry="3" fill="#000"/>
    <!-- Mouth -->
    <path d="M 45,45 Q 50,50 55,45" stroke="#000" fill="transparent" stroke-width="2"/>
    <!-- Paws -->
    <ellipse cx="40" cy="85" rx="8" ry="6" fill="#f0d5b6"/>
    <ellipse cx="60" cy="85" rx="8" ry="6" fill="#f0d5b6"/>
</svg>